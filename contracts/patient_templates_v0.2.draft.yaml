# Реестр текстов для пациента по message_template_id из alert_rules_v0.2.yaml.
# СТАТУС: ЧЕРНОВИК. Каждый текст требует утверждения медицинским экспертом (Давлет)
# до использования с реальными пациентами (Technical Spec v0.2, §12.1, §21).
# Тексты не содержат диагнозов, оценок срочности вне правил и рекомендаций по терапии.
version: "0.2.0-draft"
templates:
  - id: self_harm_safety_v1
    status: draft
    title: "Ваш врач увидит этот ответ"
    body: >
      Вы отметили мысли о смерти или о причинении себе вреда. Ваш ответ уже передан врачу.
      Если вы сейчас в опасности или чувствуете, что можете причинить себе вред, позвоните
      по номеру 112 или 103 или попросите близкого человека побыть рядом.

  - id: overdose_safety_v1
    status: draft
    title: "Возможно, принято больше препарата, чем назначено"
    body: >
      Ваше сообщение передано врачу. Если вы приняли больше препарата, чем назначено,
      и чувствуете себя плохо, позвоните по номеру 103 или 112.

  - id: allergy_safety_v1
    status: draft
    title: "Возможна аллергическая реакция"
    body: >
      Ваше сообщение передано врачу. Если появились отёк лица или горла, затруднённое
      дыхание или распространённая сыпь, позвоните по номеру 103 или 112.

  - id: lab_contact_today_v1
    status: draft
    title: "Пожалуйста, свяжитесь с клиникой сегодня"
    body: >
      Врачу нужно обсудить с вами результат анализа. Пожалуйста, свяжитесь с клиникой
      сегодня. Не меняйте приём препарата самостоятельно.

  - id: gad_worsening_v1
    status: draft
    title: "Результат передан врачу"
    body: >
      Результат опросника отличается от предыдущего. Врач увидит его и обсудит с вами
      при следующем контакте.

  - id: phq_positive_screen_v1
    status: draft
    title: "Врачу нужно оценить ваш результат"
    body: >
      Результат опросника требует оценки врача. Это не диагноз. Врач увидит ваши ответы;
      пожалуйста, свяжитесь с врачом в ближайшее время.

  - id: ae_contact_doctor_v1
    status: draft
    title: "Пожалуйста, свяжитесь с врачом"
    body: >
      Вы сообщили о симптоме, который мешает обычным делам. Сообщение передано врачу.
      Пожалуйста, свяжитесь с врачом в ближайшее время и не меняйте приём препарата
      самостоятельно.

  - id: ae_info_v1
    status: draft
    title: "Сообщение передано врачу"
    body: >
      Спасибо, мы сохранили ваше сообщение. Врач увидит его и обсудит с вами при
      следующем контакте.

  - id: anxiety_increased_v1
    status: draft
    title: "Пожалуйста, свяжитесь с врачом"
    body: >
      Вы сообщили, что тревога усилилась. Сообщение передано врачу. Пожалуйста,
      свяжитесь с врачом в ближайшее время.

  - id: missed_due_ae_v1
    status: draft
    title: "Пропуск из-за самочувствия передан врачу"
    body: >
      Вы пропустили приём из-за нежелательного явления. Пожалуйста, свяжитесь с врачом
      в ближайшее время и не меняйте схему приёма самостоятельно.

  - id: intention_stop_v1
    status: draft
    title: "Обсудите решение с врачом"
    body: >
      Мы передали врачу, что вы думаете прекратить приём препарата. Пожалуйста,
      свяжитесь с врачом в ближайшее время, чтобы обсудить это решение.

  - id: out_of_scope_v1
    status: draft
    title: "Сообщение передано врачу"
    body: >
      Эта жалоба находится вне области оценки данного инструмента. Мы передали ваше
      сообщение врачу. Система не может определить причину или срочность этой жалобы.

  - id: routing_preferred_v1
    status: draft
    title: "Врач рекомендует консультацию специалиста (желательно)"
    body: >
      Ваш врач рекомендует консультацию психиатра. С вами свяжется администратор клиники,
      чтобы согласовать время.

  - id: routing_required_v1
    status: draft
    title: "Врач направляет вас на консультацию специалиста (обязательно)"
    body: >
      Ваш врач считает консультацию психиатра обязательной. С вами свяжется администратор
      клиники, чтобы согласовать время.
