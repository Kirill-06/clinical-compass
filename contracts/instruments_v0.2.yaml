# Определения опросников. Единственный источник формулировок: backend считает баллы,
# приложение показывает вопросы из GET /meta. Изменение текста — новая версия файла.
version: "0.2.0"
instruments:
  - code: GAD7
    label: GAD-7
    version: "457_3-G2"
    title: "Шкала тревоги GAD-7"
    instruction: "Как часто за последние 2 недели вас беспокоили следующие проблемы?"
    source: "Клинические рекомендации (457_3.pdf), приложение Г2, с. 86"
    wording_note: >-
      Названия категорий 5–9 и 10–14 баллов приведены как в источнике и требуют клинического подтверждения.
    items:
      - "Повышенная нервная возбудимость, беспокойство и раздражительность"
      - "Неспособность справиться с волнением"
      - "Чрезмерное беспокойство по разному поводу"
      - "Неспособность расслабиться"
      - "Крайняя степень беспокойства: «не могу найти себе место»"
      - "Легко поддаюсь чувству беспокойства или раздражительности"
      - "Опасение чего-то страшного"
    options:
      - {value: 0, label: "Никогда"}
      - {value: 1, label: "Несколько дней"}
      - {value: 2, label: "Более половины дней"}
      - {value: 3, label: "Почти каждый день"}
    bands:
      - {code: minimal, min: 0, max: 4, label: "Минимальный"}
      - {code: mild, min: 5, max: 9, label: "Умеренный"}
      - {code: moderate, min: 10, max: 14, label: "Средний"}
      - {code: severe, min: 15, max: 21, label: "Высокий"}

  - code: PHQ9
    label: PHQ-9
    version: "ru-pfizer-draft"
    title: "Опросник депрессии PHQ-9"
    instruction: "Как часто за последние 2 недели вас беспокоили следующие проблемы?"
    source: "PHQ-9, русская версия (Pfizer). Требует сверки с источником команды."
    wording_note: >-
      Текст вопросов и названия категорий требуют подтверждения медицинским экспертом.
      В правилах v0.2 используются только сумма ≥ 10 и ответ на вопрос 9.
    items:
      - "Вам не хотелось ничего делать"
      - "У вас было плохое настроение, вы были подавлены или испытывали чувство безысходности"
      - "Вам было трудно заснуть, у вас был прерывистый сон, или вы слишком много спали"
      - "Вы были утомлены, или у вас было мало сил"
      - "У вас был плохой аппетит, или вы переедали"
      - "Вы плохо о себе думали: считали себя неудачником (неудачницей), были в себе разочарованы или считали, что подвели свою семью"
      - "Вам было трудно сосредоточиться (например, на чтении газеты или на просмотре телепередач)"
      - "Вы двигались или говорили настолько медленно, что окружающие это замечали? Или, наоборот, вы были настолько суетливы или взбудоражены, что двигались гораздо больше обычного"
      - "Вас посещали мысли о том, что вам лучше было бы умереть, или о том, чтобы причинить себе какой-нибудь вред"
    options:
      - {value: 0, label: "Ни разу"}
      - {value: 1, label: "Несколько дней"}
      - {value: 2, label: "Более недели"}
      - {value: 3, label: "Почти каждый день"}
    bands:
      - {code: minimal, min: 0, max: 4, label: "Минимальная"}
      - {code: mild, min: 5, max: 9, label: "Лёгкая"}
      - {code: moderate, min: 10, max: 14, label: "Умеренная"}
      - {code: moderately_severe, min: 15, max: 19, label: "Умеренно тяжёлая"}
      - {code: severe, min: 20, max: 27, label: "Тяжёлая"}
