[project]
name = "clinical-compass-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["clinical-compass-backend", "fastapi>=0.157", "httpx>=0.28", "pydantic-settings>=2.16", "uvicorn>=0.54"]

[tool.uv.sources]
clinical-compass-backend = { path = "../backend", editable = true }

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_compass_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
