# Ручной запуск: `uv run alembic upgrade head`, новая миграция:
# `uv run alembic revision --autogenerate -m "описание"`.
# Адрес БД берётся из CC_DATABASE_URL (см. src/clinical_compass/config.py).
[alembic]
script_location = src/clinical_compass/db/alembic
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
